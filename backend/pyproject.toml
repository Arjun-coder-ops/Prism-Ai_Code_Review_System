[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-api"
version = "0.1.0"
description = "PRISM API service"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.17,<2.0",
  "asyncpg>=0.30,<1.0",
  "celery>=5.5,<6.0",
  "fastapi==0.162.4",
  "httpx>=0.28,<1.0",
  "prometheus-client>=0.22,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "redis>=6.0,<7.0",
  "SQLAlchemy[asyncio]==2.1.8",
  "structlog>=25.0,<26.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.11,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--cov=app", "--cov-report=term-missing"]
markers = [
  "integration: tests that require supporting services",
  "security: tests for security boundaries",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
